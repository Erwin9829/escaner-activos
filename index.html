<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner OCR Series - Coppel</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 15px; 
            background-color: #f0f2f5; 
            margin: 0;
        }
        h2 { color: #0056b3; margin-bottom: 10px; font-size: 20px; }
        #video-container { 
            position: relative;
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            background: #000; 
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        video { width: 100%; height: auto; display: block; }
        canvas { display: none; }
        .form-group { 
            margin-top: 15px; 
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        input[type="text"] { 
            width: 90%; 
            padding: 12px; 
            font-size: 16px; 
            margin-bottom: 10px; 
            text-align: center; 
            border: 2px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        #numero_serie {
            font-weight: bold;
            font-size: 18px;
            background-color: #fff3cd;
            color: #856404;
            border: 2px dashed #ffeeba;
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold;
            background-color: #0056b3; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 90%;
            margin-top: 5px;
        }
        button:active { background-color: #004494; }
        #status { 
            margin-top: 15px; 
            font-size: 16px;
            font-weight: bold; 
        }
        .hint { font-size: 13px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Lector OCR de Series (Activos)</h2>
    
    <div id="video-container">
        <video id="preview" autoplay playsinline></video>
    </div>
    <canvas id="canvas"></canvas>
    
    <div class="hint">📷 Enfoca el número de serie y presiona "Capturar y Leer Serie"</div>

    <div class="form-group">
        <button onclick="capturarOCR()" style="background-color: #28a745; margin-bottom: 15px;">📸 Capturar y Leer Serie</button>
        
        <form id="activoForm" onsubmit="enviarDatos(event)">
            <input type="hidden" id="form_id">
            <input type="text" id="numero_serie" name="serie" placeholder="Número de serie (Editable)" required>
            <input type="text" id="ubicacion" name="ubicacion" placeholder="Ubicación">
            <input type="text" id="propietario" name="propietario" placeholder="Propietario / Área">
            
            <button type="submit" id="btnGuardar">Guardar en Activos</button>
        </form>
    </div>
    
    <div id="status"></div>

    <script>
        // URL real con la versión 3 implementada correctamente
        const SCRIPT_URL = "https://script.google.com/a/macros/coppel.com/s/AKfycby9xAVB0R4LtruybnzoairazIOG_cQ9yOa4bUU8_U2H5dlmbasCfOm2w3ZJLoEIhwUkig/exec";

        const video = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { exact: "environment" } } 
        })
        .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
        .then(stream => { video.srcObject = stream; })
        .catch(err => {
            statusDiv.innerText = "⚠️ No se pudo acceder a la cámara.";
            statusDiv.style.color = "red";
        });

        function capturarOCR() {
            statusDiv.innerText = "🔍 Leyendo texto con OCR...";
            statusDiv.style.color = "blue";

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/png');

            Tesseract.recognize(
                imageDataUrl,
                'eng',
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                let limpio = text.replace(/[\n\r]+/g, ' ').trim();
                document.getElementById('numero_serie').value = limpio;
                statusDiv.innerText = "✅ Texto extraído con éxito.";
                statusDiv.style.color = "green";
            }).catch(err => {
                statusDiv.innerText = "❌ Error en OCR.";
                statusDiv.style.color = "red";
            });
        }

        function enviarDatos(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            statusDiv.innerText = "⏳ Guardando en la hoja...";
            statusDiv.style.color = "orange";

            const id = 'ACT-' + Date.now();
            const serie = document.getElementById('numero_serie').value;
            const ubicacion = document.getElementById('ubicacion').value;
            const propietario = document.getElementById('propietario').value;

            const formData = new URLSearchParams();
            formData.append('id', id);
            formData.append('serie', serie);
            formData.append('ubicacion', ubicacion);
            formData.append('propietario', propietario);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                statusDiv.innerText = "✅ ¡Guardado exitosamente!";
                statusDiv.style.color = "green";
                
                document.getElementById('activoForm').reset();
                btn.disabled = false;
            })
            .catch(error => {
                statusDiv.innerText = "❌ Error al conectar con el servidor.";
                statusDiv.style.color = "red";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
